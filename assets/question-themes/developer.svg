<text x="56" y="338" class="section">▤  Problem statement</text>
<text x="544" y="338" class="section">⌘  Solution</text>
<text x="56" y="367" class="body">Given an integer array nums and an integer target,</text>
<text x="56" y="388" class="body">return the indices of two numbers that add up to target.</text>
<text x="56" y="418" class="label">EXAMPLE 1</text>
<rect x="56" y="433" width="470" height="104" rx="12" fill="#101f2d" stroke="#263a4e"/>
<text x="73" y="459" class="body">Input: nums = [2, 7, 11, 15], target = 9</text>
<text x="73" y="483" font-size="13" font-weight="700" fill="#29d5b0">Output: [0, 1]</text>
<text x="73" y="509" class="small">nums[0] + nums[1] = 9</text>
<text x="56" y="569" class="label">EXAMPLE 2</text>
<rect x="56" y="584" width="470" height="80" rx="12" fill="#101f2d" stroke="#263a4e"/>
<text x="73" y="612" class="body">Input: nums = [3, 2, 4], target = 6</text>
<text x="73" y="638" font-size="13" font-weight="700" fill="#29d5b0">Output: [1, 2]</text>
<rect x="544" y="354" width="500" height="310" rx="13" fill="#08111b" stroke="#263a4e"/>
<rect x="544" y="354" width="500" height="35" rx="13" fill="#101f2d"/>
<text x="560" y="376" class="small">Python3 · solution.py</text>
<text x="562" y="416" class="code" fill="#48b6ff">class Solution:</text>
<text x="562" y="445" class="code" fill="#a67bff">    def twoSum(self, nums, target):</text>
<text x="562" y="474" class="code" fill="#edf5ff">        seen = {}</text>
<text x="562" y="503" class="code" fill="#edf5ff">        for i, value in enumerate(nums):</text>
<text x="562" y="532" class="code" fill="#ff9e45">            complement = target - value</text>
<text x="562" y="561" class="code" fill="#edf5ff">            if complement in seen:</text>
<text x="562" y="590" class="code" fill="#29d5b0">                return [seen[complement], i]</text>
<text x="562" y="619" class="code" fill="#edf5ff">            seen[value] = i</text>
<text x="56" y="704" class="section">◷  Complexity</text>
<rect x="56" y="721" width="470" height="116" rx="13" fill="#101f2d" stroke="#263a4e"/>
<text x="76" y="751" class="label">TIME COMPLEXITY</text>
<text x="76" y="779" class="value">O(n)</text>
<text x="306" y="751" class="label">SPACE COMPLEXITY</text>
<text x="306" y="779" class="value">O(n)</text>
<text x="76" y="809" class="small">One pass + hash map lookup</text>
<text x="544" y="704" class="section">✎  Notes</text>
<rect x="544" y="721" width="500" height="116" rx="13" fill="#101f2d" stroke="#263a4e"/>
<text x="562" y="752" class="body">• Store each value with its index.</text>
<text x="562" y="777" class="body">• Check the complement before inserting.</text>
<text x="562" y="802" class="body">• Handles duplicate values such as [3, 3].</text>
<text x="56" y="886" class="section">Submission details</text>
<rect x="56" y="904" width="988" height="98" rx="13" fill="#101f2d" stroke="#263a4e"/>
<text x="74" y="932" class="label">STATUS</text><text x="74" y="959" font-size="13" font-weight="700" fill="#29d5b0">Accepted</text>
<text x="306" y="932" class="label">LANGUAGE</text><text x="306" y="959" class="body">Python3</text>
<text x="556" y="932" class="label">RUNTIME PERCENTILE</text><text x="556" y="959" class="body">40.79%</text>
<text x="806" y="932" class="label">MEMORY PERCENTILE</text><text x="806" y="959" class="body">42.52%</text>
<path d="M56 1032H1044" stroke="#263a4e"/>
<text x="56" y="1060" class="small">LEETCODE / 1 · TWO SUM</text>
<text x="1044" y="1060" text-anchor="end" class="small">Generated from submission metadata</text>
<text x="56" y="1114" class="section">Why this works</text>
<text x="56" y="1142" class="body">For each number, the hash map answers whether its complement has already appeared.</text>
<text x="56" y="1165" class="body">Each lookup and insertion is O(1) on average, so the full scan is O(n).</text>
<rect x="56" y="1200" width="988" height="54" rx="12" fill="#48b6ff" opacity=".10"/>
<text x="74" y="1232" font-size="12" font-weight="700" fill="#48b6ff">PATTERN TO REMEMBER</text>
<text x="276" y="1232" class="body">Hash Map · Complement = target − current value</text>
